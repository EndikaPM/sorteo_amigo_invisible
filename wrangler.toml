# Configuración del servidor en Cloudflare (Workers).
name = "amigo-invisible"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

# La web (carpeta "web") se sirve gratis; solo las rutas /api/* pasan por el código del servidor.
[assets]
directory = "./web"
run_worker_first = ["/api/*"]

# Donde se guarda el historial de sorteos. El "id" se rellena al crear el almacén:
#   npx wrangler kv namespace create HISTORIAL
[[kv_namespaces]]
binding = "HISTORIAL"
id = "PON_AQUI_EL_ID_DE_KV"

[vars]
# Quién aparece como remitente. El dominio debe estar verificado en Resend.
REMITENTE = "Amigo invisible <sorteo@amigoinvisiblefamiliajorge.com>"

# Los secretos NO se escriben aquí. Se guardan con:
#   npx wrangler secret put APP_PASSWORD
#   npx wrangler secret put RESEND_API_KEY
